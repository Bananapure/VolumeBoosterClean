<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volume Boost</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f10;
      --surface: #1a1a1c;
      --border: #2a2a2e;
      --accent: #e8ff47;
      --accent-dim: rgba(232, 255, 71, 0.12);
      --text: #f0f0f0;
      --muted: #666;
      --off-accent: #ff4757;
      --off-dim: rgba(255, 71, 87, 0.10);
    }

    html, body {
      width: 260px;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      user-select: none;
    }

    .container {
      padding: 20px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .icon {
      font-size: 16px;
      line-height: 1;
    }

    /* Volume Display */
    .volume-display {
      text-align: center;
      padding: 16px 0 10px;
    }

    .volume-number {
      font-family: 'DM Mono', monospace;
      font-size: 52px;
      font-weight: 500;
      line-height: 1;
      color: var(--accent);
      transition: color 0.3s ease, opacity 0.3s ease;
    }

    .volume-number.off {
      color: var(--muted);
      opacity: 0.4;
    }

    .volume-unit {
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      color: var(--muted);
      margin-top: 4px;
      letter-spacing: 0.05em;
    }

    /* Slider */
    .slider-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .slider-labels {
      display: flex;
      justify-content: space-between;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--muted);
    }

    /* Track container — positions the clip dot relative to the input */
    .slider-track-container {
      position: relative;
      padding: 4px 0;
    }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
      transition: opacity 0.3s;
      display: block;
    }

    input[type=range]:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      border: 3px solid var(--bg);
      box-shadow: 0 0 0 1px var(--accent);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    input[type=range]:not(:disabled)::-webkit-slider-thumb:hover {
      transform: scale(1.2);
      box-shadow: 0 0 0 1px var(--accent), 0 0 12px rgba(232,255,71,0.4);
    }

    input[type=range]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      border: 3px solid var(--bg);
      box-shadow: 0 0 0 1px var(--accent);
      cursor: pointer;
    }

    /* Fill track */
    input[type=range] {
      background: linear-gradient(
        to right,
        var(--accent) 0%,
        var(--accent) var(--fill, 0%),
        var(--border) var(--fill, 0%),
        var(--border) 100%
      );
    }

    input[type=range]:disabled {
      background: var(--border) !important;
    }

    /* Clip point dot — absolutely positioned over the slider track */
    .clip-dot {
      display: none; /* shown via JS when clip point is known */
      position: absolute;
      top: 50%;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--off-accent);
      border: 2px solid var(--bg);
      box-shadow: 0 0 0 1px var(--off-accent), 0 0 8px rgba(255, 71, 87, 0.5);
      transform: translate(-50%, -50%);
      pointer-events: none;
      transition: left 0.3s ease;
      z-index: 2;
    }

    /* Clip status text */
    .clip-status {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.04em;
      min-height: 13px;
      transition: color 0.25s;
    }

    .clip-status.under {
      color: var(--muted);
    }

    .clip-status.over {
      color: var(--off-accent);
    }

    /* Toggle Button */
    .toggle-btn {
      width: 100%;
      padding: 12px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .toggle-btn:hover {
      border-color: var(--accent);
      background: var(--accent-dim);
      color: var(--accent);
    }

    .toggle-btn.active {
      border-color: var(--accent);
      background: var(--accent-dim);
      color: var(--accent);
    }

    .toggle-btn.active:hover {
      border-color: var(--off-accent);
      background: var(--off-dim);
      color: var(--off-accent);
    }

    .btn-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      transition: background 0.2s;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: var(--border);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="title">Volume Boost</span>
      <span class="icon">🔊</span>
    </div>

    <div class="divider"></div>

    <div class="volume-display">
      <div class="volume-number off" id="volNum">150</div>
      <div class="volume-unit">% volume</div>
    </div>

    <div class="slider-wrap">
      <div class="slider-labels">
        <span>100%</span>
        <span>1000%</span>
      </div>
      <div class="slider-track-container">
        <input type="range" id="slider" min="100" max="1000" step="5" value="150" disabled />
        <div class="clip-dot" id="clipDot"></div>
      </div>
      <div class="clip-status" id="clipStatus"></div>
    </div>

    <button class="toggle-btn" id="toggleBtn">
      <span class="btn-dot"></span>
      <span id="btnLabel">Enable Boost</span>
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
